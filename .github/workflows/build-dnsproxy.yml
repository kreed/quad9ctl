---
name: Build dnsproxy RPM

on:
  pull_request:
    paths:
      - "dnsproxy/**"
  push:
    branches:
      - main
    paths:
      - "dnsproxy/**"
  workflow_dispatch:
    inputs:
      clone-url:
        description: Git clone URL containing the package revision
        required: true
        type: string
      commit:
        description: Git commit to build
        required: true
        type: string
      pr-number:
        description: Pull request number used for the COPR side repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-dnsproxy-${{ github.event.pull_request.number || inputs['pr-number'] || github.ref }}
  cancel-in-progress: true

jobs:
  scratch-build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    container: fedora:44
    env:
      CLONE_URL: ${{ inputs['clone-url'] || github.event.pull_request.head.repo.clone_url }}
      COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ inputs['pr-number'] || github.event.pull_request.number }}

    steps:
      - name: Install COPR client
        run: dnf -y --setopt=install_weak_deps=False install copr-cli

      - name: Configure COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "${COPR_CONFIG}"
          install -d --mode=0700 "${HOME}/.config"
          printf '%s\n' "${COPR_CONFIG}" > "${HOME}/.config/copr"
          chmod 0600 "${HOME}/.config/copr"

      - name: Build in COPR pull-request repository
        run: |
          copr-cli buildscm "quad9ctl:pr:${PR_NUMBER}" \
            --clone-url "${CLONE_URL}" \
            --commit "${COMMIT}" \
            --subdir dnsproxy \
            --spec dnsproxy.spec \
            --type git \
            --method rpkg

  final-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container: fedora:44

    steps:
      - name: Install COPR client
        run: dnf -y --setopt=install_weak_deps=False install copr-cli git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Trust the container workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Detect version bump
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "${BEFORE}:dnsproxy/dnsproxy.spec" 2>/dev/null; then
            old_version="$(git show "${BEFORE}:dnsproxy/dnsproxy.spec" | awk '$1 == "Version:" { print $2; exit }')"
          else
            old_version=""
          fi
          new_version="$(awk '$1 == "Version:" { print $2; exit }' dnsproxy/dnsproxy.spec)"
          echo "old=${old_version}" >> "${GITHUB_OUTPUT}"
          echo "new=${new_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${old_version}" != "${new_version}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure COPR
        if: steps.version.outputs.changed == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "${COPR_CONFIG}"
          install -d --mode=0700 "${HOME}/.config"
          printf '%s\n' "${COPR_CONFIG}" > "${HOME}/.config/copr"
          chmod 0600 "${HOME}/.config/copr"

      - name: Publish canonical COPR build
        if: steps.version.outputs.changed == 'true'
        run: copr-cli build-package quad9ctl --name dnsproxy
